<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f766e" />
  <title>منصة الموارد البشرية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
:root {
  --bg: #f5f7fa;
  --surface: #ffffff;
  --surface-2: #f0fdfa;
  --border: #e5e7eb;
  --text: #0f172a;
  --muted: #64748b;
  --primary: #0f766e;
  --primary-600: #0d6660;
  --primary-50: #ccfbf1;
  --danger: #dc2626;
  --warning: #d97706;
  --info: #0284c7;
  --success: #16a34a;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
  --shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
  --radius: 12px;
  --radius-sm: 8px;
  --sidebar-w: 260px;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: 'Tajawal', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.55;
}

a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ==== App shell ==== */
.app-shell {
  min-height: 100vh;
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
}
.app-shell[data-state="auth"] {
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #0f766e 0%, #134e4a 100%);
  padding: 24px;
}
.app-shell[data-state="public"] {
  display: block;
  background: var(--bg);
}

.sidebar {
  background: var(--surface);
  border-inline-start: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 20px 14px;
  gap: 16px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}
.brand { display: flex; gap: 10px; align-items: center; padding: 6px 4px 14px; border-bottom: 1px solid var(--border); }
.brand-mark {
  width: 42px; height: 42px; border-radius: 10px;
  background: var(--primary); color: #fff;
  display: grid; place-items: center; font-weight: 800;
}
.brand-title { font-weight: 800; font-size: 14px; }
.brand-sub { color: var(--muted); font-size: 12px; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav a {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: var(--radius-sm);
  color: var(--text); font-weight: 500;
}
.nav a:hover { background: var(--surface-2); text-decoration: none; }
.nav a.active { background: var(--primary-50); color: var(--primary-600); }
.nav a span { width: 22px; text-align: center; }
.sidebar-footer { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 24px;
  display: flex; align-items: center; gap: 16px;
  position: sticky; top: 0; z-index: 5;
}
.topbar-title { font-weight: 700; font-size: 18px; flex: 1; }
.btn-icon {
  background: transparent; border: 0; font-size: 22px; cursor: pointer;
  display: none; color: var(--text);
}
.user-chip {
  background: var(--surface-2); color: var(--primary-600);
  border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 600;
}
.view { padding: 24px; flex: 1; min-height: 0; }

/* ==== Buttons ==== */
.btn, .btn-ghost, .btn-danger, .btn-secondary {
  font-family: inherit; font-size: 14px; font-weight: 600;
  padding: 9px 16px; border-radius: var(--radius-sm);
  cursor: pointer; border: 1px solid transparent;
  display: inline-flex; align-items: center; gap: 6px;
  transition: all .15s ease;
}
.btn { background: var(--primary); color: #fff; }
.btn:hover { background: var(--primary-600); }
.btn:disabled { background: #94a3b8; cursor: not-allowed; }
.btn-secondary { background: var(--surface); color: var(--text); border-color: var(--border); }
.btn-secondary:hover { background: var(--surface-2); }
.btn-ghost { background: transparent; color: var(--muted); border-color: var(--border); }
.btn-ghost:hover { background: var(--surface-2); color: var(--text); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { filter: brightness(.92); }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

/* ==== Cards / sections ==== */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow-sm);
}
.section-head {
  display: flex; justify-content: space-between; align-items: center;
  gap: 12px; margin-bottom: 16px; flex-wrap: wrap;
}
.section-head h2 { margin: 0; font-size: 20px; }

/* ==== Tables ==== */
.table-wrap { overflow-x: auto; }
table.data {
  width: 100%; border-collapse: collapse; background: var(--surface);
  border-radius: var(--radius); overflow: hidden;
  border: 1px solid var(--border);
  font-size: 14px;
}
table.data th, table.data td { padding: 12px 14px; text-align: start; }
table.data thead th {
  background: var(--surface-2); font-weight: 700; color: var(--text);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
table.data tbody tr { border-top: 1px solid var(--border); }
table.data tbody tr:hover { background: #fafafa; }
.empty {
  padding: 40px; text-align: center; color: var(--muted);
  background: var(--surface); border-radius: var(--radius);
  border: 1px dashed var(--border);
}

/* ==== Pills / badges ==== */
.pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 600;
  background: var(--surface-2); color: var(--primary-600);
}
.pill-danger { background: #fee2e2; color: #b91c1c; }
.pill-warning { background: #ffedd5; color: #c2410c; }
.pill-info { background: #dbeafe; color: #1d4ed8; }
.pill-success { background: #dcfce7; color: #15803d; }
.pill-muted { background: #e2e8f0; color: #475569; }

/* ==== Modal / dialog ==== */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(15,23,42,.5);
  display: grid; place-items: center; z-index: 50; padding: 20px;
}
.modal {
  background: var(--surface); border-radius: var(--radius);
  padding: 24px; max-width: 560px; width: 100%;
  max-height: 90vh; overflow-y: auto;
}
.modal h3 { margin-top: 0; }

/* ==== Toast ==== */
.toast-host {
  position: fixed; bottom: 24px; inset-inline-end: 24px;
  display: flex; flex-direction: column; gap: 8px; z-index: 100;
}
.toast {
  background: var(--text); color: #fff; padding: 10px 14px;
  border-radius: var(--radius-sm); box-shadow: var(--shadow);
  animation: slidein .2s ease;
  font-size: 14px;
}
.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }
@keyframes slidein {
  from { transform: translateY(8px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

/* ==== Auth screen ==== */
.auth-card {
  background: var(--surface); border-radius: var(--radius);
  padding: 32px; max-width: 440px; width: 100%;
  box-shadow: var(--shadow);
}
.auth-card h1 { margin-top: 0; font-size: 22px; }
.auth-card p { color: var(--muted); margin-top: 4px; }
.auth-switch { text-align: center; margin-top: 14px; font-size: 13px; color: var(--muted); }

/* ==== Public form pages ==== */
.public-page {
  max-width: 560px; margin: 24px auto; padding: 0 16px;
}
.public-page .card { padding: 28px; }
.public-page h1 { margin-top: 0; font-size: 22px; }

/* ==== Responsive ==== */
@media (max-width: 880px) {
  .app-shell { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed; inset-inline-start: 0; top: 0;
    width: 80%; max-width: 300px; z-index: 20;
    transform: translateX(100%);
    transition: transform .25s ease;
    box-shadow: 0 0 30px rgba(0,0,0,.15);
  }
  html[dir="rtl"] .sidebar { transform: translateX(100%); }
  .app-shell.menu-open .sidebar { transform: translateX(0); }
  .btn-icon { display: inline-flex; }
  .view { padding: 16px; }
}

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 14px;
  margin-bottom: 22px;
}
.kpi {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px;
  display: flex; align-items: center; gap: 12px;
  box-shadow: var(--shadow-sm);
}
.kpi-icon {
  width: 44px; height: 44px; border-radius: 10px;
  display: grid; place-items: center;
  background: var(--surface-2); color: var(--primary-600);
  font-size: 22px;
}
.kpi-value { font-size: 22px; font-weight: 800; }
.kpi-label { color: var(--muted); font-size: 13px; }

.alert-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 16px;
}
.alert-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
  display: flex; flex-direction: column;
  box-shadow: var(--shadow-sm);
}
.alert-card-head {
  padding: 14px 16px;
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid var(--border);
  font-weight: 700;
}
.alert-card-head .count { font-size: 22px; }
.alert-card.expired .alert-card-head { background: #fee2e2; color: #b91c1c; }
.alert-card.urgent  .alert-card-head { background: #ffedd5; color: #c2410c; }
.alert-card.soon    .alert-card-head { background: #fef3c7; color: #92400e; }
.alert-card.ok      .alert-card-head { background: #dcfce7; color: #15803d; }

.alert-list { list-style: none; margin: 0; padding: 0; max-height: 260px; overflow-y: auto; }
.alert-list li {
  padding: 10px 16px; border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
  gap: 8px; font-size: 13px;
}
.alert-list li:last-child { border-bottom: 0; }
.alert-list .item-meta { color: var(--muted); font-size: 12px; }
.alert-card-foot {
  padding: 10px 16px; border-top: 1px solid var(--border);
  display: flex; justify-content: space-between; gap: 8px;
}

.dash-row {
  display: grid; grid-template-columns: 2fr 1fr;
  gap: 16px; margin-top: 22px;
}
@media (max-width: 900px) {
  .dash-row { grid-template-columns: 1fr; }
}

.activity-list { list-style: none; margin: 0; padding: 0; max-height: 360px; overflow-y: auto; }
.activity-list li {
  padding: 10px 0; border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.activity-list li:last-child { border-bottom: 0; }
.activity-list .ts { color: var(--muted); font-size: 11px; }

.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
}
.field { display: flex; flex-direction: column; gap: 6px; }
.field label {
  font-size: 13px; font-weight: 600; color: var(--text);
}
.field .hint { font-size: 11px; color: var(--muted); }
.field input, .field select, .field textarea {
  font-family: inherit; font-size: 14px;
  padding: 10px 12px; border: 1px solid var(--border);
  border-radius: var(--radius-sm); background: #fff;
  color: var(--text); width: 100%;
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline: 2px solid var(--primary-50);
  border-color: var(--primary);
}
.field textarea { min-height: 90px; resize: vertical; }
.form-actions {
  display: flex; justify-content: flex-end; gap: 8px;
  margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border);
  flex-wrap: wrap;
}
.form-actions.between { justify-content: space-between; }

.full-row { grid-column: 1 / -1; }

.tabs {
  display: flex; gap: 4px; border-bottom: 1px solid var(--border);
  margin-bottom: 16px; flex-wrap: wrap;
}
.tab {
  padding: 8px 14px; border-radius: 8px 8px 0 0;
  cursor: pointer; font-weight: 600; font-size: 13px;
  color: var(--muted); border: 1px solid transparent;
  background: transparent;
}
.tab.active { color: var(--primary-600); background: var(--surface); border-color: var(--border); border-bottom-color: var(--surface); }

.qr-box {
  display: grid; place-items: center;
  padding: 16px; background: #fff; border-radius: var(--radius);
  border: 1px solid var(--border);
}
.share-link {
  background: var(--surface-2); padding: 10px 12px;
  border-radius: var(--radius-sm); font-family: monospace;
  font-size: 12px; word-break: break-all;
  border: 1px solid var(--border);
}

.import-preview {
  max-height: 360px; overflow: auto;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
}
.import-error {
  background: #fee2e2; color: #b91c1c;
  padding: 8px 12px; border-radius: var(--radius-sm);
  margin-top: 8px; font-size: 13px;
}
.import-warning {
  background: #fef3c7; color: #92400e;
  padding: 8px 12px; border-radius: var(--radius-sm);
  margin-top: 8px; font-size: 13px;
}

.detail-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
  background: var(--surface); padding: 16px;
  border: 1px solid var(--border); border-radius: var(--radius);
}
.detail-grid .label { font-size: 12px; color: var(--muted); }
.detail-grid .val { font-weight: 600; font-size: 15px; word-break: break-word; }

.renew-bar {
  display: flex; gap: 8px; flex-wrap: wrap;
  padding: 12px; background: var(--surface-2);
  border-radius: var(--radius-sm); margin: 12px 0;
}
.renew-bar .label { align-self: center; font-size: 13px; color: var(--text); font-weight: 600; }

.search-bar {
  display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap;
}
.search-bar input {
  flex: 1; min-width: 200px;
  padding: 9px 12px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); font-family: inherit;
}

.filter-chip {
  padding: 6px 12px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--border);
  cursor: pointer; font-size: 12px; font-weight: 600;
}
.filter-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        title: r.type === "commercial" ? "\u0633\u062C\u0644 \u062A\u062C\u0627\u0631\u064A" : "\u0639\u0636\u0648\u064A\u0629 \u063A\u0631\u0641\u0629",
        subtitle: "\u0631\u0642\u0645: " + (r.number || "\u2014"),
        expiry: r.expiryDate,
        link: `#/registrations/${r.id}`
      }));
    });
    store.list("licenses").forEach((l) => {
      groups.license.push(makeItem({
        kind: "license",
        refId: l.id,
        title: licenseTypeLabel(l.type) + " \u2014 " + (l.authority || ""),

        expiry: l.expiryDate,

      }));

    store.list("employees").forEach((e) => {

        groups.iqama.push(makeItem({
          kind: "iqama",
          refId: e.id,
          title: e.fullName,
          subtitle: "\u0631\u0642\u0645 \u0627\u0644\u0625\u0642\u0627\u0645\u0629: " + (e.iqamaNumber || "\u2014"),

  function sendBatchAlert(items, channels = ["in-app"]) {

      card.appendChild(el("h1", {}, "\u0627\u0644\u0631\u0627\u0628\u0637 \u063A\u064A\u0631 \u0635\u0627\u0644\u062D"));
      card.appendChild(el("p", {}, "\u0627\u0644\u0631\u0627\u0628\u0637 \u0645\u0646\u062A\u0647\u064A \u0623\u0648 \u0645\u0644\u063A\u0649."));
      return;
    }
    const est = store.state.establishments[payload.estId];
    const rowsHost = el("div", {});
    const rows = [];
    function addRow(initial = {}) {
      const r = {
        fullName: input({ value: initial.fullName || "" }),
        nationality: input({ value: initial.nationality || "" }),
        iqamaNumber: input({ value: initial.iqamaNumber || "" }),
        iqamaExpiry: input({ type: "date", value: initial.iqamaExpiry || "" }),
        phone: input({ value: initial.phone || "", type: "tel" }),
        jobTitle: input({ value: initial.jobTitle || "" })
      };
      const node = el("div", { class: "card", style: { marginTop: "10px" } }, [
        el("div", { class: "form-grid" }, [
          field("\u0627\u0644\u0627\u0633\u0645 \u0627\u0644\u0643\u0627\u0645\u0644", r.fullName),
          field("\u0627\u0644\u062C\u0646\u0633\u064A\u0629", r.nationality),
          field("\u0631\u0642\u0645 \u0627\u0644\u0625\u0642\u0627\u0645\u0629", r.iqamaNumber),
          field("\u0627\u0646\u062A\u0647\u0627\u0621 \u0627\u0644\u0625\u0642\u0627\u0645\u0629", r.iqamaExpiry),
          field("\u0627\u0644\u062C\u0648\u0627\u0644", r.phone),
          field("\u0627\u0644\u0648\u0638\u064A\u0641\u0629", r.jobTitle)
        ]),
        el("div", { class: "form-actions" }, [
          el("button", { type: "button", class: "btn-danger btn-sm", onClick: () => {
            rows.splice(rows.indexOf(entry), 1);
            node.remove();
          } }, "\u062D\u0630\u0641 \u0647\u0630\u0627 \u0627\u0644\u0635\u0641")
        ])
      ]);
      const entry = { node, fields: r };
      rows.push(entry);
      rowsHost.appendChild(node);
    }
    addRow();
    card.appendChild(el("h1", {}, "\u0625\u062F\u062E\u0627\u0644 \u062F\u0641\u0639\u0629 \u0628\u064A\u0627\u0646\u0627\u062A"));
    card.appendChild(el("p", {}, [
      "\u0644\u0640 ",
      el("strong", {}, est?.name || "\u062C\u0647\u0629 \u0627\u0644\u0639\u0645\u0644"),
      ". \u064A\u0645\u0643\u0646\u0643 \u0625\u0636\u0627\u0641\u0629 \u0639\u062F\u0629 \u0639\u0645\u0627\u0644 \u0641\u064A \u0646\u0641\u0633 \u0627\u0644\u062C\u0644\u0633\u0629."
    ]));
    card.appendChild(rowsHost);
    card.appendChild(el("div", { class: "form-actions between" }, [
      el("button", { class: "btn-secondary", onClick: () => addRow() }, "+ \u0625\u0636\u0627\u0641\u0629 \u0635\u0641"),
      el("button", { class: "btn", onClick: submit }, "\u0625\u0631\u0633\u0627\u0644 \u0627\u0644\u062F\u0641\u0639\u0629")
    ]));
    function submit() {
      const data = rows.map((r) => ({
        fullName: r.fields.fullName.value.trim(),
        nationality: r.fields.nationality.value.trim(),
        iqamaNumber: r.fields.iqamaNumber.value.trim(),
        iqamaExpiry: r.fields.iqamaExpiry.value,
        phone: r.fields.phone.value.trim(),
        jobTitle: r.fields.jobTitle.value.trim()
      })).filter((d) => d.fullName);
      if (!data.length) {
        toast("\u0627\u0644\u0631\u062C\u0627\u0621 \u0625\u062F\u062E\u0627\u0644 \u0628\u064A\u0627\u0646\u0627\u062A \u0639\u0627\u0645\u0644 \u0648\u0627\u062D\u062F \u0639\u0644\u0649 \u0627\u0644\u0623\u0642\u0644", "error");
        return;
      }
      store.addPendingSubmission({
        estId: payload.estId,
        kind: "hr-batch",
        token,
        payload: data,
        submittedAt: (/* @__PURE__ */ new Date()).toISOString()
      });
      const code = btoa(unescape(encodeURIComponent(JSON.stringify({
        estId: payload.estId,
        kind: "hr-batch",
        payload: data,
        submittedAt: (/* @__PURE__ */ new Date()).toISOString()
      })))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
      card.replaceChildren(
        el("h1", {}, "\u062A\u0645 \u0627\u0633\u062A\u0644\u0627\u0645 \u0627\u0644\u062F\u0641\u0639\u0629 \u2713"),
        el("p", {}, `\u062A\u0645 \u062A\u0633\u062C\u064A\u0644 ${data.length} \u0639\u0627\u0645\u0644. \u0623\u0631\u0633\u0644 \u0627\u0644\u0643\u0648\u062F \u0627\u0644\u062A\u0627\u0644\u064A \u0644\u0645\u0633\u0624\u0648\u0644 \u0627\u0644\u0646\u0638\u0627\u0645 \u0644\u062F\u0645\u062C\u0647:`),
        el("div", { class: "share-link" }, code),
        el("div", { class: "form-actions" }, [
          el("button", { class: "btn-secondary", onClick: async () => {
            try {
              await navigator.clipboard.writeText(code);
              toast("\u062A\u0645 \u0646\u0633\u062E \u0627\u0644\u0643\u0648\u062F", "success");
            } catch {
              toast("\u062A\u0639\u0630\u0631 \u0627\u0644\u0646\u0633\u062E", "error");
            }
          } }, "\u0646\u0633\u062E \u0627\u0644\u0643\u0648\u062F")
        ])
      );
      window.scrollTo(0, 0);
    }
  }

  // hr-platform/app/main.js
  var ROUTES = [
    { pattern: "#/login", view: guardPublic(renderLogin), public: true },
    { pattern: "#/register", view: guardPublic(renderRegister), public: true },
    { pattern: "#/p/worker", view: shellPublic(renderPublicWorker), public: true },
    { pattern: "#/p/hr", view: shellPublic(renderPublicHR), public: true },
    { pattern: "#/", view: guardAuthed(renderDashboard, "\u0627\u0644\u0631\u0626\u064A\u0633\u064A\u0629", "dashboard") },
    { pattern: "#/dashboard", view: guardAuthed(renderDashboard, "\u0627\u0644\u0631\u0626\u064A\u0633\u064A\u0629", "dashboard") },
    { pattern: "#/branches", view: guardAuthed(renderBranches, "\u0627\u0644\u0641\u0631\u0648\u0639", "branches") },
    { pattern: "#/branches/:id", view: guardAuthed(renderBranchDetail, "\u0627\u0644\u0641\u0631\u0648\u0639", "branches") },
    { pattern: "#/registrations", view: guardAuthed(renderRegistrations, "\u0627\u0644\u0633\u062C\u0644\u0627\u062A", "registrations") },
    { pattern: "#/registrations/:id", view: guardAuthed(renderRegistrationDetail, "\u0627\u0644\u0633\u062C\u0644\u0627\u062A", "registrations") },
    { pattern: "#/licenses", view: guardAuthed(renderLicenses, "\u0627\u0644\u062A\u0631\u0627\u062E\u064A\u0635", "licenses") },
    { pattern: "#/licenses/:id", view: guardAuthed(renderLicenseDetail, "\u0627\u0644\u062A\u0631\u0627\u062E\u064A\u0635", "licenses") },
    { pattern: "#/employees", view: guardAuthed(renderEmployees, "\u0627\u0644\u0639\u0645\u0627\u0644\u0629", "employees") },
    { pattern: "#/employees/:id", view: guardAuthed(renderEmployeeDetail, "\u0627\u0644\u0639\u0645\u0627\u0644\u0629", "employees") },
    { pattern: "#/import", view: guardAuthed(renderImport, "\u0627\u0633\u062A\u064A\u0631\u0627\u062F Excel", "import") },
    { pattern: "#/share", view: guardAuthed(renderShareLinks, "\u0627\u0644\u0631\u0648\u0627\u0628\u0637 \u0627\u0644\u062E\u0627\u0631\u062C\u064A\u0629", "share") },
    { pattern: "#/notifications", view: guardAuthed(renderNotifications, "\u0633\u062C\u0644 \u0627\u0644\u0625\u0634\u0639\u0627\u0631\u0627\u062A", "notifications") }
  ];
  function guardAuthed(viewFn, title, navKey) {
    return (ctx) => {
      if (!isAuthed()) {
        navigate("#/login");
        return;
      }
      ensureShell();
      setPageTitle(title);
      setActiveNav(navKey);
      refreshUserChip();
      viewFn(ctx);
    };
  }
  function guardPublic(viewFn) {
    return (ctx) => {
      if (isAuthed()) {
        navigate("#/dashboard");
        return;
      }
      renderAuthShell(viewFn, ctx);
    };
  }
  function shellPublic(viewFn) {
    return (ctx) => renderPublicShell(viewFn, ctx);
  }
  function renderAuthShell(viewFn, ctx) {
    const app = document.getElementById("app");
    app.dataset.state = "auth";
    clear(app);
    viewFn(ctx, app);
  }
  function renderPublicShell(viewFn, ctx) {
    const app = document.getElementById("app");
    app.dataset.state = "public";
    clear(app);
    viewFn(ctx, app);
  }
  function ensureShell() {
    const app = document.getElementById("app");
    if (app.dataset.state !== "shell") {
      app.dataset.state = "shell";
      app.classList.remove("menu-open");
      clear(app);
      const tpl = document.getElementById("tpl-shell");
      app.appendChild(tpl.content.cloneNode(true));
      bindShell(app);
    }
  }
  function bindShell(app) {
    app.addEventListener("click", (e) => {
      const action = e.target.closest("[data-action]")?.dataset.action;
      if (action === "logout") {
        logout();
        toast("\u062A\u0645 \u062A\u0633\u062C\u064A\u0644 \u0627\u0644\u062E\u0631\u0648\u062C");
        navigate("#/login");
      } else if (action === "toggle-sidebar") {
        app.classList.toggle("menu-open");
      } else if (e.target.closest(".nav a")) {
        app.classList.remove("menu-open");
      }
    });
  }
  function setActiveNav(key) {
    document.querySelectorAll(".nav a").forEach((a) => {
      a.classList.toggle("active", a.dataset.nav === key);
    });
  }
  function refreshUserChip() {
    const est = store.currentEst();
    const chip = document.querySelector("[data-user-chip]");
    const sub = document.querySelector("[data-est-name]");
    if (chip) chip.textContent = est ? est.ownerEmail : "\u2014";
    if (sub) sub.textContent = est ? est.name : "\u2014";
  }
  defineRoutes(ROUTES);
  store.subscribe(() => {
    if (document.getElementById("app").dataset.state === "shell") refreshUserChip();
  });
  startRouter();
  window.addEventListener("load", () => {
    const h = currentHash();
    if (h === "#/" || h === "" || h === "#") {
      if (!isAuthed()) navigate("#/login");
    }
  });
})();

  </script>
</body>
</html>
