<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />

  <link rel="stylesheet" href="./styles/main.css" />
  <link rel="stylesheet" href="./styles/dashboard.css" />
  <link rel="stylesheet" href="./styles/forms.css" />

<body>
  <div id="app" class="app-shell" data-state="loading"></div>

  <template id="tpl-shell">
    <aside class="sidebar" aria-label="القائمة الرئيسية">
      <div class="brand">
        <div class="brand-mark">م.ب</div>
        <div class="brand-text">
          <div class="brand-title">منصة الموارد البشرية</div>
          <div class="brand-sub" data-est-name>—</div>
        </div>
      </div>
      <nav class="nav">
        <a href="#/dashboard" data-nav="dashboard"><span>🏠</span> الرئيسية</a>
        <a href="#/branches" data-nav="branches"><span>🏢</span> الفروع</a>
        <a href="#/registrations" data-nav="registrations"><span>📜</span> السجلات</a>

        <button type="button" class="btn-ghost" data-action="logout">تسجيل الخروج</button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button type="button" class="btn-icon" data-action="toggle-sidebar" aria-label="القائمة">☰</button>
        <div class="topbar-title" data-page-title>الرئيسية</div>
        <div class="topbar-actions">
          <span class="user-chip" data-user-chip>—</span>
        </div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </template>

  <script type="importmap">
  {
    "imports": {
      "xlsx": "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm",
      "qrcode": "https://cdn.jsdelivr.net/npm/qrcode@1.5.3/+esm"
    }
  }
  </script>
  <script type="module" src="./app/main.js"></script>
