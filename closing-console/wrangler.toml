name = "closing-console"
main = "worker/src/index.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "dev"

[[d1_databases]]
binding = "DB"
database_name = "dcc"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "worker/migrations"

[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "dcc-attachments"

[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "404-page"

[triggers]
crons = ["0 3 * * *"]

[observability]
enabled = true
