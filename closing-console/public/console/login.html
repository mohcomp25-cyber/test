<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الدخول · DCC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/console/assets/tokens.css">
<link rel="stylesheet" href="/console/assets/console.css">
</head>
<body>
<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px;">
  <form id="f" class="card" style="width:100%;max-width:380px;">
    <div style="text-align:center;margin-bottom:18px;">
      <div style="font-size:24px;font-weight:900;color:var(--org);letter-spacing:3px;">DCC</div>
      <div class="muted" style="font-size:11px;margin-top:4px;">كونسول التقفيل اليومي</div>
    </div>
    <div class="field">
      <label for="email">البريد</label>
      <input id="email" type="email" required autofocus>
    </div>
    <div class="field">
      <label for="password">كلمة المرور</label>
      <input id="password" type="password" required>
    </div>
    <button class="primary" style="width:100%;padding:12px;" type="submit">دخول</button>
    <div id="err" class="red" style="margin-top:10px;font-size:12px;text-align:center;"></div>
  </form>
</div>
<script type="module">
import { api } from "/console/assets/console.js";
const f = document.getElementById("f");
const err = document.getElementById("err");
f.addEventListener("submit", async e => {
  e.preventDefault();
  err.textContent = "";
  try {
    await api.post("/api/auth/login", {
      email: document.getElementById("email").value.trim().toLowerCase(),
      password: document.getElementById("password").value,
    });
    location.href = "/console/index.html";
  } catch (ex) {
    err.textContent = ex.data?.error === "bad_credentials" ? "بيانات الدخول غير صحيحة" : "خطأ في الدخول";
  }
});
</script>
</body>
</html>
