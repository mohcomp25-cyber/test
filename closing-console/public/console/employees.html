<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الموظفين · DCC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/console/assets/tokens.css">
<link rel="stylesheet" href="/console/assets/console.css">
</head>
<body>
<div class="app">
  <div id="top"></div>
  <div id="content"></div>
</div>
<script type="module">
import { api, ensureAuth, topbar, el, modal, toast, fmt, parseAmount, fmtDate } from "/console/assets/console.js";

const acc = await ensureAuth();
document.getElementById("top").append(...topbar("employees", acc.name));
const c = document.getElementById("content");
let activeBrand = null;

async function render() {
  c.innerHTML = "";
  const brands = (await api.get("/api/brands")).brands.filter(b => !b.archived);
  if (!brands.length) { c.append(el("div", { class: "empty card" }, "أنشئ براند أولاً")); return; }
  if (!activeBrand) activeBrand = brands[0].id;

  const sel = el("select", { onchange: e => { activeBrand = +e.target.value; render(); } },
    ...brands.map(b => el("option", { value: b.id, selected: b.id === activeBrand }, b.name)));

  const card = el("div", { class: "card" },
    el("div", { class: "section-title" }, "البراند", sel,
      el("span", { class: "actions" }, el("button", { class: "primary", onclick: addEmp }, "إضافة موظف"))),
    el("div", { id: "empwrap" }));
  c.append(card);

  const data = await api.get(`/api/brands/${activeBrand}/employees`);
  const wrap = document.getElementById("empwrap");
  if (!data.employees.length) { wrap.append(el("div", { class: "empty" }, "ما في موظفين")); return; }

  const tbl = el("table");
  tbl.append(el("thead", {}, el("tr", {},
    el("th", {}, "الاسم"), el("th", {}, "الجوال"), el("th", {}, "رصيد العهدة"),
    el("th", {}, "الحالة"), el("th", {}, ""))));
  const tb = el("tbody");
  for (const e of data.employees) {
    tb.append(el("tr", {},
      el("td", {}, e.name),
      el("td", {}, e.phone || "—"),
      el("td", { class: "tabular " + (e.custody_balance_h < 0 ? "red" : "") }, fmt(e.custody_balance_h)),
      el("td", {}, e.archived ? el("span", { class: "badge muted" }, "مؤرشف") : el("span", { class: "badge" }, "نشط")),
      el("td", {},
        el("button", { class: "tiny ghost", onclick: () => topup(e) }, "شحن/خصم عهدة"),
        " ",
        el("button", { class: "tiny ghost", onclick: () => ledger(e) }, "السجل"),
        " ",
        el("button", { class: "tiny ghost", onclick: () => editEmp(e) }, "تعديل")),
    ));
  }
  tbl.append(tb);
  wrap.append(tbl);
}

function addEmp() {
  const n = el("input", { placeholder: "اسم الموظف" });
  const p = el("input", { placeholder: "05xxxxxxxx" });
  const cust = el("input", { type: "text", value: "0.00", inputmode: "decimal" });
  modal("إضافة موظف", el("div", {},
    el("div", { class: "field" }, el("label", {}, "الاسم"), n),
    el("div", { class: "field" }, el("label", {}, "الجوال"), p),
    el("div", { class: "field" }, el("label", {}, "العهدة الافتتاحية (ر.س)"), cust),
  ), [
    { label: "إلغاء", class: "ghost", onClick: c => c() },
    { label: "حفظ", class: "primary", onClick: async close => {
      let h = 0;
      try { h = parseAmount(cust.value || "0"); } catch { return toast("رقم غير صحيح", "err"); }
      await api.post(`/api/brands/${activeBrand}/employees`, {
        name: n.value.trim(), phone: p.value.trim() || null, custody_balance_h: h,
      });
      toast("تم"); close(); render();
    } },
  ]);
}

function editEmp(e) {
  const n = el("input", { value: e.name });
  const p = el("input", { value: e.phone || "" });
  modal("تعديل موظف", el("div", {},
    el("div", { class: "field" }, el("label", {}, "الاسم"), n),
    el("div", { class: "field" }, el("label", {}, "الجوال"), p),
  ), [
    { label: "إلغاء", class: "ghost", onClick: c => c() },
    { label: "أرشفة", class: "danger", onClick: async close => {
      if (!confirm("تأكيد؟")) return;
      await api.del(`/api/employees/${e.id}`); toast("أرشف"); close(); render();
    } },
    { label: "حفظ", class: "primary", onClick: async close => {
      await api.patch(`/api/employees/${e.id}`, { name: n.value.trim(), phone: p.value.trim() || null });
      toast("تم"); close(); render();
    } },
  ]);
}

function topup(e) {
  const a = el("input", { type: "text", inputmode: "decimal", placeholder: "0.00" });
  const note = el("input", { placeholder: "ملاحظة" });
  modal(`عهدة: ${e.name} (الرصيد ${fmt(e.custody_balance_h)})`, el("div", {},
    el("div", { class: "muted", style: "font-size:12px;margin-bottom:8px;" }, "أدخل رقماً موجباً للشحن، أو سالباً للخصم/الإرجاع."),
    el("div", { class: "field" }, el("label", {}, "المبلغ (ر.س)"), a),
    el("div", { class: "field" }, el("label", {}, "ملاحظة"), note),
  ), [
    { label: "إلغاء", class: "ghost", onClick: c => c() },
    { label: "تنفيذ", class: "primary", onClick: async close => {
      let h = 0;
      try { h = parseAmount(a.value); } catch { return toast("رقم غير صحيح", "err"); }
      if (!h) return toast("ادخل مبلغ", "err");
      await api.post(`/api/employees/${e.id}/custody-topup`, { amount_h: h, note: note.value.trim() });
      toast("تم"); close(); render();
    } },
  ]);
}

async function ledger(e) {
  const data = await api.get(`/api/employees/${e.id}/custody-ledger`);
  const tb = el("tbody");
  for (const m of data.movements) {
    const sign = m.amount_h >= 0 ? "+" : "−";
    tb.append(el("tr", {},
      el("td", {}, fmtDate(m.business_date)),
      el("td", {}, kindLabel(m.kind)),
      el("td", { class: "tabular " + (m.amount_h < 0 ? "red" : "org") }, `${sign} ${fmt(Math.abs(m.amount_h))}`),
      el("td", { class: "muted", style: "font-size:11px;" }, m.note || "—")));
  }
  const tbl = el("table");
  tbl.append(el("thead", {}, el("tr", {},
    el("th", {}, "التاريخ"), el("th", {}, "النوع"), el("th", {}, "المبلغ"), el("th", {}, "ملاحظة"))));
  tbl.append(tb);
  modal(`سجل العهدة: ${e.name} — الرصيد ${fmt(data.balance_h)}`, tbl);
}

function kindLabel(k) {
  return ({ topup: "شحن", expense: "صرف", return: "إرجاع", adjustment: "تسوية" })[k] || k;
}

await render();
</script>
</body>
</html>
